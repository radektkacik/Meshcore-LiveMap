server {
    listen 80;
    server_name mapa.meshcore.cz;
    # Origin lockdown: only Cloudflare edge IPs (geo in conf.d/cloudflare-geo.conf).
    if ($cloudflare_allowed = 0) { return 403; }

    include /etc/nginx/snippets/meshcore-cms-block.conf;

    location / {
        proxy_pass http://127.0.0.1:4173/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
}
