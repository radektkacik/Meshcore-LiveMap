# Záměrná blokace CMS a běžných skenovacích cest.
# Mapa je vlastní Node aplikace; žádná z těchto cest k ní nepatří.
# Požadavky vracejí 404 ještě před proxy_pass a zůstávají v nginx access.logu.
# Neodstraňujte bez ověření, že konkrétní cesta není potřeba pro aplikaci.
# Beta location /beta/ záměrně nemá ^~, aby tyto regexe platily i pro /beta/.

location ~* ^/(?:beta/)?wp- { return 404; }
location ~* ^/(?:beta/)?xmlrpc\.php$ { return 404; }
location ~* ^/(?:beta/)?readme\.html$ { return 404; }
location ~* ^/(?:beta/)?graphql(?:/|$) { return 404; }
location ~* ^/(?:beta/)?api/graphql(?:/|$) { return 404; }
location ~* ^/(?:beta/)?administrator(?:/|$) { return 404; }
location ~* ^/(?:beta/)?sites/default(?:/|$) { return 404; }
location ~* ^/(?:beta/)?configuration\.php$ { return 404; }
location ~* ^/(?:beta/)?phpmyadmin(?:/|$) { return 404; }
location ~* ^/(?:beta/)?\.env(?:$|[/?]) { return 404; }
location ~* ^/(?:beta/)?\.git(?:/|$) { return 404; }
